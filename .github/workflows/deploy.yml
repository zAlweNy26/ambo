name: Deploy to Cloudflare Worker
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Builds, applies D1 migrations and deploys (needs void.lock.json from a first local deploy)
      - name: Deploy with Void
        run: bunx void deploy --platform cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  report:
    needs: deploy
    name: PageSpeed Insights metrics
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: pagespeed.svg
          token: NOT_NEEDED
          base: ''
          plugin_pagespeed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_url: https://ambo.danyalwe.me
