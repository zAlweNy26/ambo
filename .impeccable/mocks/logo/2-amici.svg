<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ambo! — Gli Amici dell'Ambo</title>
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#de3540" />
      <stop offset="1" stop-color="#a31621" />
    </radialGradient>
    <radialGradient id="wood" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f6e2bf" />
      <stop offset=".6" stop-color="#d9ad76" />
      <stop offset="1" stop-color="#ad7c44" />
    </radialGradient>
    <radialGradient id="wood2" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#efd3a6" />
      <stop offset=".6" stop-color="#cf9f66" />
      <stop offset="1" stop-color="#9c6c38" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <ellipse cx="256" cy="440" rx="190" ry="20" fill="#5a0d14" opacity=".4" />
  <!-- back buddy, leaning in -->
  <g transform="rotate(14 330 290)">
    <circle cx="330" cy="280" r="122" fill="#7a4d22" />
    <circle cx="330" cy="268" r="122" fill="url(#wood2)" />
    <text x="330" y="232" text-anchor="middle" font-family="Geist, sans-serif" font-weight="800" font-size="72" fill="#c41e2a">7</text>
    <circle cx="296" cy="276" r="13" fill="#2b1608" />
    <circle cx="364" cy="276" r="13" fill="#2b1608" />
    <circle cx="300" cy="271" r="4" fill="#fff" />
    <circle cx="368" cy="271" r="4" fill="#fff" />
    <path d="M300 312 q30 26 60 0" fill="none" stroke="#2b1608" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="276" cy="306" rx="16" ry="9" fill="#e4676d" opacity=".55" />
    <ellipse cx="384" cy="306" rx="16" ry="9" fill="#e4676d" opacity=".55" />
  </g>
  <!-- front buddy, winking -->
  <g transform="rotate(-10 182 300)">
    <circle cx="182" cy="306" r="122" fill="#7a4d22" />
    <circle cx="182" cy="294" r="122" fill="url(#wood)" />
    <text x="182" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-weight="800" font-size="72" fill="#c41e2a">4</text>
    <circle cx="148" cy="302" r="13" fill="#2b1608" />
    <circle cx="152" cy="297" r="4" fill="#fff" />
    <path d="M204 302 q14 -12 28 0" fill="none" stroke="#2b1608" stroke-width="10" stroke-linecap="round" />
    <path d="M146 336 q36 34 72 0" fill="#7a1018" stroke="#2b1608" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="126" cy="330" rx="16" ry="9" fill="#e4676d" opacity=".55" />
    <ellipse cx="240" cy="330" rx="16" ry="9" fill="#e4676d" opacity=".55" />
  </g>
</svg>
