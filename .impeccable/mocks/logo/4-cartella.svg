<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ambo! — Cartella che ride</title>
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#de3540" />
      <stop offset="1" stop-color="#a31621" />
    </radialGradient>
    <radialGradient id="wood" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f6e2bf" />
      <stop offset=".6" stop-color="#d9ad76" />
      <stop offset="1" stop-color="#ad7c44" />
    </radialGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="14" fill="#c41e2a" opacity=".22" />
    </pattern>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <!-- the paper card, slightly tilted, with a soft drop -->
  <g transform="rotate(-6 256 256)">
    <rect x="70" y="112" width="372" height="300" rx="36" fill="#5a0d14" opacity=".35" transform="translate(0 14)" />
    <rect x="70" y="112" width="372" height="300" rx="36" fill="#fffdf9" />
    <rect x="70" y="112" width="372" height="56" rx="36" fill="#c41e2a" />
    <rect x="70" y="140" width="372" height="28" fill="#c41e2a" />
    <circle cx="112" cy="140" r="9" fill="#fff" opacity=".8" />
    <!-- eyes: two drawn numbers covered by wooden tokens -->
    <g stroke="#7a4d22" stroke-width="5">
      <circle cx="176" cy="236" r="44" fill="url(#wood)" />
      <circle cx="336" cy="236" r="44" fill="url(#wood)" />
    </g>
    <circle cx="186" cy="240" r="14" fill="#2b1608" />
    <circle cx="346" cy="240" r="14" fill="#2b1608" />
    <circle cx="191" cy="234" r="5" fill="#fff" />
    <circle cx="351" cy="234" r="5" fill="#fff" />
    <!-- the grin: a printed row bending into a smile, blanks hatched -->
    <path d="M118 302 q138 110 276 0" fill="none" stroke="#c41e2a" stroke-width="10" stroke-linecap="round" />
    <path d="M150 324 q106 72 212 0 l-10 -16 q-96 58 -192 0 z" fill="url(#hatch)" />
    <g font-family="Geist, sans-serif" font-weight="800" font-size="34" fill="#c41e2a" text-anchor="middle">
      <text x="148" y="352" transform="rotate(20 148 352)">2</text>
      <text x="256" y="388">48</text>
      <text x="364" y="352" transform="rotate(-20 364 352)">77</text>
    </g>
  </g>
</svg>
