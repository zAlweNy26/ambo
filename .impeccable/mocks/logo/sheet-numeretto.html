<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Ambo! logo proposals</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Geist,sans-serif;background:#f6f4f0;color:#1c1917;padding:40px;width:1440px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{background:#fff;border:1px solid #e4e4e0;border-radius:16px;overflow:hidden}
.top{padding:24px;display:flex;align-items:end;gap:16px}
.top img.big{width:136px;height:136px}
.top img.fav{width:32px;height:32px}
.top img.mid{width:64px;height:64px}
.bar{background:#c41e2a;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:600;font-size:18px}
.bar img{width:34px;height:34px}
.dark{background:#0f0f0e;display:flex;gap:14px;padding:16px 18px;align-items:center}
.dark img{width:48px;height:48px}
.meta{padding:16px 20px 22px}
.meta b{display:block;font-size:17px;margin-bottom:4px}
.meta p{font-size:14px;color:#57534e;line-height:1.45}
</style></head><body>
<h1>Ambo! — Numeretto, numeral variants</h1>
<div class="grid">
<div class="card"><div class="top"><img class="big" src="1a-ultra.svg"><img class="mid" src="1a-ultra.svg"><img class="fav" src="1a-ultra.svg"></div>
  <div class="bar"><img src="1a-ultra.svg">Ambo!</div><div class="dark"><img src="1a-ultra.svg"></div>
  <div class="meta"><b>1A</b><p>Ultra — fat Clarendon, like stamped numeretti</p></div></div>
<div class="card"><div class="top"><img class="big" src="1b-abril.svg"><img class="mid" src="1b-abril.svg"><img class="fav" src="1b-abril.svg"></div>
  <div class="bar"><img src="1b-abril.svg">Ambo!</div><div class="dark"><img src="1b-abril.svg"></div>
  <div class="meta"><b>1B</b><p>Abril Fatface — heavy Didone</p></div></div>
<div class="card"><div class="top"><img class="big" src="1c-rozha.svg"><img class="mid" src="1c-rozha.svg"><img class="fav" src="1c-rozha.svg"></div>
  <div class="bar"><img src="1c-rozha.svg">Ambo!</div><div class="dark"><img src="1c-rozha.svg"></div>
  <div class="meta"><b>1C</b><p>Rozha One — high-contrast Didone</p></div></div>
<div class="card"><div class="top"><img class="big" src="1d-zilla.svg"><img class="mid" src="1d-zilla.svg"><img class="fav" src="1d-zilla.svg"></div>
  <div class="bar"><img src="1d-zilla.svg">Ambo!</div><div class="dark"><img src="1d-zilla.svg"></div>
  <div class="meta"><b>1D</b><p>Zilla Slab Bold — sturdy slab</p></div></div>
</div>
</body></html>
